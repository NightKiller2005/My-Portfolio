    <!--
      Build-mode bootstrap. Runs before first paint so unbuilt content never flashes.
      Desktop: URL params > saved desktop preference > on.
      Mobile: off by default; only explicit URL requests opt in.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var on = true;
        try {
          var q = new URLSearchParams(location.search);
          var a = q.get("agents");
          var stored = null;
          try { stored = localStorage.getItem("cr-agents"); } catch (e) {}
          var mobile = !!(window.matchMedia && matchMedia("(max-width: 767px)").matches);
          if (mobile) on = q.get("tour") === "1" || a === "on";
          else if (a === "on") on = true;
          else if (a === "off") on = false;
          else if (stored === "off") on = false;
          else on = true;
        } catch (e) { on = false; }
        window.__AGENTS_INITIAL__ = on;
        if (on) d.classList.add("build-mode", "is-booting");
        // Safety net: if the scripts fail, show the page anyway.
        setTimeout(function () {
          if (!window.__PORTFOLIO_READY__) {
            d.classList.remove("build-mode", "is-booting");
            d.classList.add("build-failsafe");
          }
        }, 5000);
      })();
    </script>

    <!-- Floating control dock -->
    <div class="dock" id="dock" role="toolbar" aria-label="Build controls">

        <span class="dock__led" aria-hidden="true"></span>
        <span class="dock__status-text" id="dockStatus">Booting</span>
      </div>
      <button class="dock__btn" id="btnPause" type="button" aria-pressed="false" disabled>
        <span class="dock__icon" data-icon="pause"></span>
        <span class="dock__label">Pause</span>
        <kbd>P</kbd>
      </button>
      <button class="dock__btn" id="btnAgents" type="button" aria-pressed="true" disabled>
        <span class="dock__icon" data-icon="bot"></span>
        <span class="dock__label">Agents</span>
        <kbd>A</kbd>

      <button class="dock__btn" id="btnTour" type="button" aria-pressed="false" disabled>
        <span class="dock__icon" data-icon="route"></span>
        <span class="dock__label">Tour</span>
        <kbd>T</kbd>
      </button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="certificate-dialog" id="certificateDialog" aria-labelledby="certificateDialogTitle">
      <div class="certificate-dialog__head">
        <h2 class="certificate-dialog__title" id="certificateDialogTitle"></h2>
        <button class="certificate-dialog__close" type="button" aria-label="Close certificate" data-certificate-close>&times;</button>
      </div>
      <div class="certificate-dialog__images"></div>
      <p class="certificate-dialog__empty" hidden>Images have not been added yet.</p>
    </dialog>
